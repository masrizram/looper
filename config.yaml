# =============================================================================
# Looper Daemon configuration
# -----------------------------------------------------------------------------
# Read by looper/config.py (default: config.yaml, fallback looper_config.yaml).
# All fields are OPTIONAL -- any omitted field falls back to the code default.
#
# SECURITY RULE: this file NEVER stores secrets. It only holds the NAME of an
# environment variable (e.g. api_key_env); the actual value is read from env.
#
# Validate config: python -m looper.cli --check-config
# =============================================================================

# Working directory, relative to the CWD when the daemon is launched.
workspace: "./workspace"
state_file: "./looper_state.json"
watch_file: "./looper_commands.txt"

# Poll interval for the watch_file, in seconds.
watch_interval: 2.0

# --- HTTP API server ---------------------------------------------------------
# WARNING: POST /build triggers execution of LLM-generated code. Treat this
# endpoint as remote code execution. It binds 127.0.0.1 (localhost only) by default.
# Binding ANYTHING other than loopback (0.0.0.0, ::, or a LAN address) WITHOUT an
# auth token is REJECTED at startup (not merely warned about). See ADR-004.
http:
  bind: "127.0.0.1"
  port: 9999
  # Name of the env var holding the bearer token. Compared constant-time (hmac).
  auth_token_env: "LOOPER_HTTP_TOKEN"
  # Request body size limit (bytes) -- prevents memory exhaustion.
  max_body_bytes: 65536
  # Goal length limit (characters) -- prevents unbounded LLM spend.
  max_goal_length: 20000
  # /build request limit per minute per client IP address.
  rate_limit_per_minute: 10

execution:
  max_cycles: 5
  target_score: 99
  min_acceptable: 95
  # Hard timeout for pytest over LLM-generated code. Without it, a single
  # infinite loop in a generated test would hang the 24/7 daemon forever.
  test_timeout_seconds: 600
  # Cap on history/error entries in the state file -- stops it growing forever.
  max_history_entries: 500
  # Per-file byte cap for agent output. An agent that loops could fill the
  # daemon's disk; overflow is truncated and flagged.
  max_file_bytes: 2000000
  # Per-build API cost ceiling (USD). 0 = unlimited. Exceeding it aborts the
  # build forcibly (exit code 4) instead of stacking up the bill. ADR-005.
  max_cost_usd: 0.0
  # Default USD price per 1K tokens (used for cost estimates). Can be tightened
  # per model via model_prices_usd_per_1k (see the example below).
  default_token_price_usd: 0.002
  # model_prices_usd_per_1k:
  #   "anthropic/claude-3.5-sonnet": 0.003
  #   "openai/gpt-4o": 0.005
  # Path to YOUR OWN pytest suite (relative to the config dir or absolute).
  # The AI code must ALSO pass these tests before the build is considered done --
  # closes the overfitting hole (the AI writing weak tests for itself). ADR-06.
  user_tests_dir: ""
  # Reject AI-written test suites that are too thin (asserts per 100 lines).
  # 0 = disable this floor.
  min_test_assertions_per_100_lines: 6
  # Run the pytest suite under resource limits (CPU/wall/RSS) so looping or
  # wasteful AI code cannot hang or OOM the host. The suite is always statically
  # scanned first: os.system/subprocess/network/eval calls are REFUSED. ADR-06.
  sandbox_tests: true
  sandbox_cpu_seconds: 60
  sandbox_wall_seconds: 300
  sandbox_rss_bytes: 1000000000
  # Isolation backend: auto | rlimit | docker | none. ADR-008.
  #   auto   -> prefer Docker if present, otherwise POSIX rlimits.
  #   docker -> single-use container: read-only, no network, cpu/memory/pids
  #             capped. The ONLY option with identical guarantees on Windows.
  #   rlimit -> preexec_fn + RLIMIT_CPU/RLIMIT_AS (POSIX only).
  #   none   -> NO isolation. LLM-generated code runs directly on the host.
  sandbox_backend: "auto"
  sandbox_image: "python:3.11-slim"
  sandbox_network: "none"
  # IMPORTANT: if no isolation backend is available, REFUSE to run AI-authored
  # tests (rather than silently running them unprotected). Check first with
  # `python -m looper.cli --doctor` -- exit 5 means this host is unsafe.
  # Set false only if you consciously accept the risk. ADR-008.
  sandbox_fail_closed: true
  # single_file -> one src/generated_code.py (the default, legacy behaviour).
  # package     -> the builder may emit a multi-file tree via the "### FILE: path"
  #                marker. Paths pass an allowlist; the count is capped. ADR-009.
  artifact_mode: "single_file"
  max_files_per_build: 25
  # Record each build to git so the output can be reviewed with `git diff`. ADR-010.
  git:
    enabled: false
    branch_prefix: "looper/"
    commit_per_cycle: true
    author_name: "looper"
    author_email: "looper@localhost"
  # Lint AI-generated code before accepting it: py_compile (default) / flake8 / off.
  lint_generated: "py_compile"

# --- LLM call retry policy --------------------------------------------------
retry:
  max_attempts: 3
  backoff_base: 2.0   # seconds; exponential 2s, 4s, 8s, ...
  backoff_max: 60.0   # per-backoff cap

# --- Score weights (must sum to 100) -----------------------------------------
# severity: penalty per security finding, subtracted from the "security" bucket.
# See docs/adr/002-fail-closed-scoring.md for the rationale.
scoring:
  build: 20
  tests: 30
  security: 30
  review: 20
  severity:
    critical: 30
    high: 15
    medium: 5
    low: 2
    unknown: 5
  # Hard cap: unverified build/test never enters the release band.
  unverified_build_cap: 60
  # Hard cap: a single CRITICAL finding fails the gate.
  critical_finding_cap: 50

# --- Connection to OpenRouter ------------------------------------------------
openrouter:
  base_url: "https://openrouter.ai/api/v1"
  # ONLY the environment variable name, NOT the API key itself.
  # Export in the shell:  export OPENROUTER_API_KEY=sk-or-...
  api_key_env: "OPENROUTER_API_KEY"
  site_url: ""            # optional, used for ranking on openrouter.ai
  site_name: "Looper Daemon"
  # Hard timeout for a single LLM call (seconds). Without it a stalled
  # connection would hang the phase -- and the whole daemon -- indefinitely.
  request_timeout_seconds: 300

# --- Role -> model -----------------------------------------------------------
# Optional per-agent fields: model, role, temperature, max_tokens.
# Swap the "model" string any time without touching the code.
agents:
  # Tiered assignment. Every slug is VERIFIED against the live OpenRouter
  # catalogue (`python -m looper.cli --check-models`). A wrong slug passes
  # --check-config (it is a valid-looking string) and only explodes mid-build
  # after earlier phases have already been billed -- which is why there is a
  # dedicated verification command.
  #
  # Tier 1 Frontier (~$5-30/M) -> reasoning, low token volume
  # Tier 2 Daily   (~$2-10/M)  -> coding, high token volume
  # Tier 3 Cheap   (~$1-12/M)  -> long-form prose, large context
  researcher:
    model: "anthropic/claude-opus-5"
  architect:
    model: "anthropic/claude-opus-5"
  ux_api_designer:
    model: "openai/gpt-5.6-sol"
  builder:
    model: "anthropic/claude-sonnet-5"
  # Test design is where overfitting is caught, so use a frontier model from a
  # DIFFERENT family than the builder. If the code author and the test author
  # share a model, their blind spots line up. ADR-006.
  tester:
    model: "anthropic/claude-opus-5"
  # The reviewer is also deliberately a different family from the builder
  # (Sonnet), so the review is genuinely independent rather than the model
  # grading its own writing style.
  reviewer:
    model: "openai/gpt-5.6-terra"
  security_auditor:
    model: "openai/gpt-5.6-sol"
  performance_optimizer:
    model: "anthropic/claude-sonnet-5"
  documentation_writer:
    model: "google/gemini-3.1-pro-preview"
  fixer:
    model: "anthropic/claude-sonnet-5"

# --- Phases to run (optional) -----------------------------------------------
# phases:        first cycle (full pipeline)
# retry_phases:  repeat after a fix (re-validation only)
# final_phases:  run once after the score gate is met
# phases:
#   - research
#   - architecture
#   - build
#   - test
#   - review
#   - security_audit
# retry_phases:
#   - test
#   - review
#   - security_audit
# final_phases:
#   - performance_optimize
#   - documentation

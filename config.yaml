# =============================================================================
# Looper Daemon configuration
# -----------------------------------------------------------------------------
# Dibaca oleh looper/config.py (default: config.yaml, fallback looper_config.yaml).
# Semua field OPSIONAL -- yang tidak ditulis memakai default di kode.
#
# ATURAN KEAMANAN: file ini TIDAK PERNAH menyimpan secret. Yang disimpan hanya
# NAMA environment variable (mis. api_key_env), nilainya diambil dari env.
#
# Validasi config: python -m looper.cli --check-config
# =============================================================================

# Direktori kerja relatif terhadap CWD saat menjalankan daemon.
workspace: "./workspace"
state_file: "./looper_state.json"
watch_file: "./looper_commands.txt"

# Interval polling watch_file, dalam detik.
watch_interval: 2.0

# --- HTTP API server ---------------------------------------------------------
# PERINGATAN: POST /build memicu eksekusi kode buatan LLM. Perlakukan endpoint
# ini sebagai remote code execution. Default bind 127.0.0.1 (localhost saja).
# Bind APA PUN selain loopback (0.0.0.0, ::, atau alamat LAN) TANPA auth
# token akan DITOLAK saat startup (bukan cuma warning). Lihat ADR-004.
http:
  bind: "127.0.0.1"
  port: 9999
  # Nama env var berisi bearer token. Dibandingkan constant-time (hmac).
  auth_token_env: "LOOPER_HTTP_TOKEN"
  # Batas ukuran body request (byte) -- cegah memory exhaustion.
  max_body_bytes: 65536
  # Batas panjang goal (karakter) -- cegah biaya LLM tak terbatas.
  max_goal_length: 20000
  # Batas request /build per menit per alamat IP.
  rate_limit_per_minute: 10

execution:
  max_cycles: 5
  target_score: 99
  min_acceptable: 95
  # Hard timeout untuk pytest atas kode buatan LLM. Tanpa ini, satu
  # infinite-loop di generated test menggantung daemon 24/7 selamanya.
  test_timeout_seconds: 600
  # Batas entri history/errors di state -- cegah file state tumbuh tanpa henti.
  max_history_entries: 500
  # Batas byte per file yang ditulis dari output agent. LLM yang ngeloop
  # bisa memenuhi disk daemon 24/7; kelebihannya dipotong + ditandai.
  max_file_bytes: 2000000
  # Plafon biaya API per build (USD). 0 = tanpa batas. Lewati nilai ini ->
  # build dihentikan paksa (exit code 4), bukan terus menumpuk tagihan. ADR-005.
  max_cost_usd: 0.0
  # Harga default USD per 1K token (dipakai estimasi biaya). Bisa diper-tight
  # per model lewat model_prices_usd_per_1k (lihat contoh di bawah).
  default_token_price_usd: 0.002
  # model_prices_usd_per_1k:
  #   "anthropic/claude-3.5-sonnet": 0.003
  #   "openai/gpt-4o": 0.005
  # Path ke suite pytest MILIK ANDA (relatif thd config atau absolut).
  # Kode AI harus LULUS test ini juga sebelum build dianggap selesai --
  # menutup celah overfitting (AI menulis test lemah untuk dirinya sendiri). ADR-06.
  user_tests_dir: ""
  # Tolak suite test buatan AI yang terlalu tipis (assert per 100 baris).
  # 0 = nonaktifkan lantai ini.
  min_test_assertions_per_100_lines: 6
  # Jalankan pytest suite di bawah resource limit (CPU/wall/RSS) agar kode
  # AI yang ngeloop/boros tak bisa gantung atau OOM host. Selalu scan statis
  # suite dulu: panggilan os.system/subprocess/network/eval DITOLAK dijalankan. ADR-06.
  sandbox_tests: true
  sandbox_cpu_seconds: 60
  sandbox_wall_seconds: 300
  sandbox_rss_bytes: 1000000000
  # Backend isolasi: auto | rlimit | docker | none. ADR-008.
  #   auto   -> pilih Docker kalau daemon-nya hidup, kalau tidak POSIX rlimits.
  #   docker -> container sekali pakai: read-only, tanpa network, cpu/memory/pids
  #             dibatasi. SATU-SATUNYA opsi dengan jaminan sama di Windows.
  #   rlimit -> preexec_fn + RLIMIT_CPU/RLIMIT_AS (POSIX saja).
  #   none   -> TANPA isolasi. Kode buatan LLM jalan langsung di host.
  sandbox_backend: "auto"
  sandbox_image: "python:3.11-slim"
  sandbox_network: "none"
  # PENTING: kalau tidak ada backend isolasi yang tersedia, TOLAK menjalankan
  # test buatan AI (bukan diam-diam jalan tanpa proteksi). Cek dulu dengan
  # `python -m looper.cli --doctor` -- exit 5 artinya host ini tidak aman.
  # Set false hanya kalau Anda sadar menerima risikonya. ADR-008.
  sandbox_fail_closed: true
  # single_file -> satu src/generated_code.py (default, perilaku lama).
  # package     -> builder boleh mengeluarkan pohon multi-file lewat penanda
  #                "### FILE: path". Path lewat allowlist, jumlah dibatasi. ADR-009.
  artifact_mode: "single_file"
  max_files_per_build: 25
  # Rekam tiap build ke git supaya hasilnya bisa direview pakai `git diff`. ADR-010.
  git:
    enabled: false
    branch_prefix: "looper/"
    commit_per_cycle: true
    author_name: "looper"
    author_email: "looper@localhost"
  # Lint kode hasil AI sebelum diterima: py_compile (default) / flake8 / off.
  lint_generated: "py_compile"

# --- Kebijakan retry panggilan LLM -------------------------------------------
retry:
  max_attempts: 3
  backoff_base: 2.0   # detik; eksponensial 2s, 4s, 8s, ...
  backoff_max: 60.0   # plafon per-jeda

# --- Bobot skor (harus berjumlah 100) ----------------------------------------
# severity: penalti per temuan keamanan, dikurangkan dari jatah "security".
# Lihat docs/adr/002-fail-closed-scoring.md untuk alasannya.
scoring:
  build: 20
  tests: 30
  security: 30
  review: 20
  severity:
    critical: 30
    high: 15
    medium: 5
    low: 2
    unknown: 5
  # Plafon keras: build/test tak terverifikasi tak pernah masuk band rilis.
  unverified_build_cap: 60
  # Plafon keras: satu temuan CRITICAL menggagalkan gate.
  critical_finding_cap: 50

# --- Koneksi ke OpenRouter ---------------------------------------------------
openrouter:
  base_url: "https://openrouter.ai/api/v1"
  # HANYA nama environment variable, BUKAN API key-nya.
  # Export di shell:  export OPENROUTER_API_KEY=sk-or-...
  api_key_env: "OPENROUTER_API_KEY"
  site_url: ""            # opsional, untuk ranking di openrouter.ai
  site_name: "Looper Daemon"
  # Hard timeout satu panggilan LLM (detik). Tanpa ini satu koneksi macet
  # menggantung phase -- dan seluruh daemon -- tanpa batas.
  request_timeout_seconds: 300

# --- Role -> model -----------------------------------------------------------
# Field opsional per agent: model, role, temperature, max_tokens.
# Ganti string "model" kapan saja tanpa menyentuh kode.
agents:
  # Tiered assignment. Semua slug DIVERIFIKASI terhadap katalog live OpenRouter
  # (`python -m looper.cli --check-models`). Slug yang salah lolos --check-config
  # (bentuknya string valid) dan baru meledak di tengah build setelah fase
  # sebelumnya terlanjur dibayar -- makanya ada perintah verifikasi tersendiri.
  #
  # Tier 1 Frontier (~$5-30/M) -> reasoning, volume token rendah
  # Tier 2 Daily   (~$2-10/M)  -> coding, volume token tinggi
  # Tier 3 Cheap   (~$1-12/M)  -> prosa panjang, context besar
  researcher:
    model: "anthropic/claude-opus-5"
  architect:
    model: "anthropic/claude-opus-5"
  ux_api_designer:
    model: "openai/gpt-5.6-sol"
  builder:
    model: "anthropic/claude-sonnet-5"
  # Desain test adalah tempat overfitting ketahuan, jadi pakai model frontier
  # dari KELUARGA BERBEDA dengan builder. Kalau penulis kode dan penulis test
  # model yang sama, blind spot-nya ikut sama. ADR-006.
  tester:
    model: "anthropic/claude-opus-5"
  # Reviewer juga sengaja beda keluarga dari builder (Sonnet), supaya review
  # benar-benar independen, bukan model menilai gaya tulisannya sendiri.
  reviewer:
    model: "openai/gpt-5.6-terra"
  security_auditor:
    model: "openai/gpt-5.6-sol"
  performance_optimizer:
    model: "anthropic/claude-sonnet-5"
  documentation_writer:
    model: "google/gemini-3.1-pro-preview"
  fixer:
    model: "anthropic/claude-sonnet-5"

# --- Phase yang dijalankan (opsional) ----------------------------------------
# phases:        siklus pertama (pipeline lengkap)
# retry_phases:  siklus ulang setelah fix (hanya re-validasi)
# final_phases:  sekali jalan setelah gate skor terpenuhi
# phases:
#   - research
#   - architecture
#   - build
#   - test
#   - review
#   - security_audit
# retry_phases:
#   - test
#   - review
#   - security_audit
# final_phases:
#   - performance_optimize
#   - documentation

name: release

# Tag-driven release: build the sdist+wheel, verify the artifact actually
# installs and runs, then publish to PyPI via Trusted Publishing (no token
# stored in the repo) and attach the files to a GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('looper/__init__.py').read_text()).group(1))")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != package version $PKG"; exit 1; }

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata renders on PyPI
        run: python -m twine check dist/*

      - name: Install the built wheel in a clean venv and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/looper --version
          /tmp/smoke/bin/looper --doctor || true   # doctor exits 5 on a host with no sandbox

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

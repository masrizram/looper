name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency-vulnerability sweep: a clean audit today can rot.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check (black)
        run: black --check --diff looper/ tests/ daemon.py

      - name: Import order (isort)
        run: isort --check-only --diff looper/ tests/ daemon.py

      - name: Lint (flake8)
        run: flake8 looper/ tests/ daemon.py

      - name: Type check (mypy --strict)
        run: mypy looper/ daemon.py --strict

      - name: Tests with 100% line+branch coverage gate
        run: |
          pytest --cov=looper --cov=daemon --cov-branch \
                 --cov-report=term-missing --cov-report=xml \
                 --cov-fail-under=100

      - name: Verify the package imports without a config file
        # Regression guard for ADR-001: importing must have no side effects.
        run: |
          mkdir -p /tmp/empty && cd /tmp/empty
          PYTHONPATH=$GITHUB_WORKSPACE python -c "import looper, daemon; print(looper.__version__)"

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: SAST (bandit)
        run: bandit -r looper/ daemon.py -ll

      - name: Dependency CVE audit (pip-audit)
        run: pip-audit -r requirements.txt --strict

  config:
    name: Validate shipped config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: config.yaml must pass validation
        run: python -m looper.cli --check-config

  # A-4: the 100% coverage gate cannot prove the sandbox *contains* hostile
  # code -- it only proves the subprocess launch lines executed. This job runs
  # genuinely destructive payloads (filesystem escape, runaway CPU, fork bomb)
  # through run_sandboxed and fails the build if any of them reaches the host.
  # Coverage was giving a false sense of safety on the two isolation bugs
  # flagged in the v3 audit (H-1 docker_argv, H-3 rlimit tuple shape).
  sandbox-integration:
    name: Sandbox containment (real payloads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pull sandbox image
        run: docker pull python:3.11-slim

      - name: Run hostile-payload containment test
        run: python scripts/sandbox_integration_test.py

  models:
    name: Verify model slugs against OpenRouter
    runs-on: ubuntu-latest
    # Model rot is time-based, not commit-based: a slug that works today can be
    # retired next month without anyone touching this repo. The weekly cron in
    # `on.schedule` is what actually catches that; running it per-push just
    # stops a bad slug from landing in the first place.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Every configured model slug must be served by OpenRouter
        # Exits 2 on an unknown slug. A wrong slug is well-formed YAML, so
        # --check-config cannot catch it; without this it surfaces mid-build,
        # after earlier phases have already been billed.
        #
        # No API key is used: the catalogue endpoint is public. If it is
        # unreachable the command warns and exits 0, so a network blip cannot
        # turn into a red build on an unrelated PR.
        run: python -m looper.cli --check-models

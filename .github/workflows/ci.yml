name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency-vulnerability sweep: a clean audit today can rot.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check (black)
        run: black --check --diff looper/ tests/ daemon.py

      - name: Import order (isort)
        run: isort --check-only --diff looper/ tests/ daemon.py

      - name: Lint (flake8)
        run: flake8 looper/ tests/ daemon.py

      - name: Type check (mypy --strict)
        run: mypy looper/ daemon.py --strict

      - name: Tests with 100% line+branch coverage gate
        run: |
          pytest --cov=looper --cov=daemon --cov-branch \
                 --cov-report=term-missing --cov-report=xml \
                 --cov-fail-under=100

      - name: Verify the package imports without a config file
        # Regression guard for ADR-001: importing must have no side effects.
        run: |
          mkdir -p /tmp/empty && cd /tmp/empty
          PYTHONPATH=$GITHUB_WORKSPACE python -c "import looper, daemon; print(looper.__version__)"

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: SAST (bandit)
        run: bandit -r looper/ daemon.py -ll

      - name: Dependency CVE audit (pip-audit)
        run: pip-audit -r requirements.txt --strict

  config:
    name: Validate shipped config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: config.yaml must pass validation
        run: python -m looper.cli --check-config
